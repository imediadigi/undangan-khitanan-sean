    (function () {

      const guest = params.get("to");
      const finalUrl = guest
        ? TARGET_BASE + "?to=" + encodeURIComponent(guest)
        : TARGET_BASE;

      const linkEl = document.getElementById("manualLink");
      if (linkEl) linkEl.href = finalUrl;

      const metaEl = document.getElementById("metaRefresh");
      if (metaEl) metaEl.content = "1;url=" + finalUrl;

      window.setTimeout(function () {
        window.location.replace(targetUrlFallback(finalUrl));
      }, 350);

      function targetUrlFallback(url) {
        return url;
      }
    })();
